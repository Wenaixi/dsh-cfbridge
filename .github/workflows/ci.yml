name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # 综合套件是唯一的验证入口：构建、两类类型检查、全部行为测试、
      # 安全检查、严格结构校验与 Wrangler 只读检查都在其中。
      # 无 Token 时 Wrangler 只做本地的 --version 探测，不会阻断 CI。
      - run: npm test
      - run: npm pack --dry-run

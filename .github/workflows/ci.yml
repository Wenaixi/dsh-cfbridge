name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run validate:bundle
      - name: Wrangler smoke (best-effort, no token in CI)
        run: npm run test:wrangler || echo "::warning::wrangler smoke skipped — no CLOUDFLARE_API_TOKEN in CI"
      - run: npm pack --dry-run
